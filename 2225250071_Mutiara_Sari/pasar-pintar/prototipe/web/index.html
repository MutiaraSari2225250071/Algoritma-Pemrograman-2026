<script>window.PP_WEB = true;</script><title>Pasar Pintar</title>

<style>
/* Tata letak: satu kolom HP (maks 560px), header lengket di atas, bilah aksi/navigasi di bawah (zona ibu jari), keypad rupiah muncul dari bawah */
:root{
  --bg:#F2F6F5; --surface:#FFFFFF; --surface-2:#E6EFED; --text:#0F1F1C; --muted:#566B66; --line:#D3DFDC;
  --primary:#0F766E; --primary-ink:#FFFFFF; --primary-soft:#D5EEEA;
  --awal:#1D4ED8; --awal-soft:#DDE7FD;
  --pot:#C2410C; --pot-soft:#FDE5D6;
  --akhir:#15803D; --akhir-soft:#DAF2E1;
  --untung:#166534; --untung-soft:#CDEFD8;
  --rugi:#B91C1C; --rugi-soft:#FDE2E2;
  --pajak:#6D28D9; --pajak-soft:#EDE7FD;
  --benar:#15803D; --benar-soft:#DAF2E1;
  --salah:#A16207; --salah-soft:#FBF0CF;
  --toko-a:#FFF1C2; --toko-a-ink:#6B4500;
  --toko-b:#FCE4F1; --toko-b-ink:#9D174D;
  --shadow:0 -6px 20px rgba(15,31,28,.12);
  --display:'Fredoka','Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1614; --surface:#15211E; --surface-2:#1C2B28; --text:#E6EFED; --muted:#9BB0AB; --line:#2A3C38;
    --primary:#2DD4BF; --primary-ink:#04211D; --primary-soft:#123A35;
    --awal:#8AB4FF; --awal-soft:#1A2A4D;
    --pot:#FDA36B; --pot-soft:#3E2416;
    --akhir:#5BE38E; --akhir-soft:#143421;
    --untung:#86EFAC; --untung-soft:#12301C;
    --rugi:#FCA5A5; --rugi-soft:#3B1717;
    --pajak:#C4B5FD; --pajak-soft:#2A2047;
    --benar:#5BE38E; --benar-soft:#143421;
    --salah:#FACC15; --salah-soft:#3A3010;
    --toko-a:#3B3112; --toko-a-ink:#FFE08A;
    --toko-b:#3D1A2C; --toko-b-ink:#F9A8D4;
    --shadow:0 -6px 20px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1614; --surface:#15211E; --surface-2:#1C2B28; --text:#E6EFED; --muted:#9BB0AB; --line:#2A3C38;
  --primary:#2DD4BF; --primary-ink:#04211D; --primary-soft:#123A35;
  --awal:#8AB4FF; --awal-soft:#1A2A4D;
  --pot:#FDA36B; --pot-soft:#3E2416;
  --akhir:#5BE38E; --akhir-soft:#143421;
  --untung:#86EFAC; --untung-soft:#12301C;
  --rugi:#FCA5A5; --rugi-soft:#3B1717;
  --pajak:#C4B5FD; --pajak-soft:#2A2047;
  --benar:#5BE38E; --benar-soft:#143421;
  --salah:#FACC15; --salah-soft:#3A3010;
  --toko-a:#3B3112; --toko-a-ink:#FFE08A;
  --toko-b:#3D1A2C; --toko-b-ink:#F9A8D4;
  --shadow:0 -6px 20px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 132px;display:flex;flex-direction:column;gap:14px}
body.kp-open .wrap{padding-bottom:340px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px;display:flex;align-items:center;gap:6px;min-height:58px}
.top-t{flex:1;min-width:0}
.top h1{font-size:1.1rem}
.top p{color:var(--muted);font-size:.85rem}
.icon-btn{min-width:48px;min-height:48px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;margin-left:-10px}
.pill-btn{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:800;font-size:.9rem}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:1.2rem}
.eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tanya{font-size:1.15rem;font-weight:700}

.btn{min-height:52px;border-radius:14px;border:0;padding:0 18px;font-weight:800;font-size:1rem;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.secondary{background:var(--surface-2);color:var(--text)}
.btn.ghost{background:transparent;color:var(--primary);min-height:48px}
.row{display:flex;gap:10px}
.row > *{flex:1;min-width:0}

.actionbar,.bnav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.actionbar{padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.actionbar .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.bnav{padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.bnav button{min-height:60px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.75rem;font-weight:700;color:var(--muted)}
.bnav button[aria-current="page"]{color:var(--primary)}
body.kp-open .actionbar,body.kp-open .bnav{display:none}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);font-weight:700}
.opt .mark{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.opt[aria-pressed="true"] .mark{border-color:var(--primary);background:var(--primary)}
.opt.ok{border-color:var(--benar);background:var(--benar-soft)}
.opt.no{border-color:var(--salah);background:var(--salah-soft)}

.lbl{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.875rem;padding:3px 10px 3px 8px;border-radius:999px;white-space:nowrap}
.lbl .ic{width:16px;height:16px}
.lbl-awal{color:var(--awal);background:var(--awal-soft)}
.lbl-pot{color:var(--pot);background:var(--pot-soft)}
.lbl-akhir{color:var(--akhir);background:var(--akhir-soft)}
.lbl-untung{color:var(--untung);background:var(--untung-soft)}
.lbl-rugi{color:var(--rugi);background:var(--rugi-soft)}
.lbl-pajak{color:var(--pajak);background:var(--pajak-soft)}
.lbl-netral{color:var(--text);background:var(--surface-2)}

.dk{display:grid;gap:8px}
.dk-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dk-val{font-weight:800;font-variant-numeric:tabular-nums;font-size:1.05rem}
.dk-mini{position:sticky;top:calc(env(safe-area-inset-top,0px) + 59px);z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.9rem}
.dk-mini b{font-variant-numeric:tabular-nums}

.soal p{font-size:1.1rem;line-height:1.9}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:2px 10px;margin:2px 0;border-radius:10px;border:2px dashed var(--primary);background:var(--surface);font-weight:800;font-variant-numeric:tabular-nums;vertical-align:middle}
.chip.c-awal{border-style:solid;border-color:var(--awal);background:var(--awal-soft);color:var(--awal)}
.chip.c-pot{border-style:solid;border-color:var(--pot);background:var(--pot-soft);color:var(--pot)}
.chip.c-akhir{border-style:solid;border-color:var(--akhir);background:var(--akhir-soft);color:var(--akhir)}
.chip.c-untung{border-style:solid;border-color:var(--untung);background:var(--untung-soft);color:var(--untung)}
.chip.c-rugi{border-style:solid;border-color:var(--rugi);background:var(--rugi-soft);color:var(--rugi)}
.chip.c-pajak{border-style:solid;border-color:var(--pajak);background:var(--pajak-soft);color:var(--pajak)}
.chip.c-netral{border-style:solid;border-color:var(--text);background:var(--surface-2)}
.chip.no{border-style:solid;border-color:var(--salah);background:var(--salah-soft)}

.eq{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-variant-numeric:tabular-nums;font-size:1.05rem}
.field{min-height:54px;flex:1 1 160px;min-width:0;display:flex;align-items:center;gap:4px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums;text-align:left}
.field .rp{color:var(--muted);font-size:1rem;font-weight:700}
.field.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.field.ok{border-color:var(--benar);background:var(--benar-soft)}
.field.no{border-color:var(--salah);background:var(--salah-soft)}
.ph{color:var(--muted);font-weight:400;font-size:1rem}

.fb{border-radius:14px;padding:12px 14px;border:2px solid;display:flex;gap:10px;align-items:flex-start}
.fb .badge{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:var(--surface)}
.fb.ok{border-color:var(--benar);background:var(--benar-soft)}
.fb.ok .badge{background:var(--benar)}
.fb.no{border-color:var(--salah);background:var(--salah-soft)}
.fb.no .badge{background:var(--salah)}
.fb strong{display:block}
.hintbox{border-left:4px solid var(--primary);background:var(--primary-soft);border-radius:0 12px 12px 0;padding:10px 12px;display:grid;gap:6px;font-size:.95rem}

.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.steps .n{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.steps .t{font-weight:800;display:block}
.steps .num{display:block}

.bar{width:100%;max-width:100%;height:auto;display:block}
.bar text{font-family:var(--font);font-size:11px;font-weight:800}
.f-awal{fill:var(--awal)} .f-pot{fill:var(--pot)} .f-akhir{fill:var(--akhir)} .f-untung{fill:var(--untung)} .f-rugi{fill:var(--rugi)} .f-pajak{fill:var(--pajak)}
.t-awal{fill:var(--awal)} .t-pot{fill:var(--pot)} .t-akhir{fill:var(--akhir)} .t-untung{fill:var(--untung)} .t-rugi{fill:var(--rugi)} .t-pajak{fill:var(--pajak)} .t-total{fill:var(--text)}
.ln-dash{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 3;fill:none}
.grid100{width:100%;max-width:200px;height:auto;display:block;margin:0 auto}
.g-on{fill:var(--primary)} .g-off{fill:var(--surface-2)}
.cap{text-align:center;font-size:.875rem;color:var(--muted)}

.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--primary);width:22px;border-radius:4px}

.paas{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.paas button{min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:1.2rem}
.paas button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary);color:var(--primary-ink)}
.paas-scale{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}

.siklus{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.siklus li{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;font-weight:700;color:var(--muted);text-align:center;line-height:1.2}
.siklus span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);font-size:.85rem}
.siklus li.now{color:var(--primary)}
.siklus li.now span{border-color:var(--primary);background:var(--primary);color:var(--primary-ink)}
.siklus li.past span{border-color:var(--primary);color:var(--primary)}

.stim-btn{border:0;padding:0;background:transparent;width:100%;display:block;border-radius:12px}
.brosur{width:100%;max-width:100%;height:auto;display:block}
.brosur text{font-family:var(--font)}
.b-bg{fill:var(--surface-2)}
.b-a{fill:var(--toko-a)} .b-a-t{fill:var(--toko-a-ink)}
.b-b{fill:var(--toko-b)} .b-b-t{fill:var(--toko-b-ink)}
.b-strip{fill:var(--surface)} .b-strip-t{fill:var(--text)} .b-mut{fill:var(--muted)}
.b-name{font-size:12px;font-weight:800;letter-spacing:.08em}
.b-big{font-size:18px;font-weight:800}
.b-huge{font-size:34px;font-weight:800}
.b-huge2{font-size:24px;font-weight:800}
.b-small{font-size:11px;font-weight:700}
.b-tiny{font-size:10px;font-weight:600}
.stim-mini{display:flex;flex-wrap:wrap;gap:6px}
.stim-mini span{font-size:.85rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface-2)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.tog{min-height:48px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;text-align:left}
.tog[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.tog.no{border-color:var(--salah);background:var(--salah-soft)}

.banding{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.banding .b{border-radius:14px;padding:12px;display:grid;gap:2px}
.banding .ba{background:var(--toko-a);color:var(--toko-a-ink)}
.banding .bb{background:var(--toko-b);color:var(--toko-b-ink)}
.banding strong{font-size:1.25rem;font-variant-numeric:tabular-nums}

.items{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:132px}
.item[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.item .nm{font-weight:800}
.item s{color:var(--awal);font-weight:700;font-variant-numeric:tabular-nums}
.item .harga{font-weight:800;font-size:1.1rem;font-variant-numeric:tabular-nums}
.tag-d{align-self:flex-start;font-size:.75rem;font-weight:800;color:var(--pot);background:var(--pot-soft);padding:2px 8px;border-radius:999px}
.item .pick{margin-top:auto;font-size:.8rem;font-weight:800;color:var(--primary)}
.uang{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.uang strong{font-size:1.4rem;font-variant-numeric:tabular-nums}

.struk{font-variant-numeric:tabular-nums;display:grid;gap:6px;border:1.5px dashed var(--line);border-radius:12px;padding:14px;background:var(--bg)}
.struk .ln{display:flex;justify-content:space-between;gap:10px}
.struk .tot{border-top:1.5px dashed var(--line);padding-top:6px;font-weight:800}
.kasir-row{display:grid;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.kasir-row:last-child{border-bottom:0;padding-bottom:0}

.home-hero{background:var(--primary);color:var(--primary-ink);border-radius:20px;padding:18px;display:grid;gap:12px}
.home-hero h2{font-size:1.4rem}
.home-hero .btn{background:var(--primary-ink);color:var(--primary)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px}
.tile .ic{width:28px;height:28px;color:var(--primary)}
.tile strong{font-family:var(--display);font-weight:600;font-size:1.05rem}
.tile span{font-size:.85rem;color:var(--muted)}
.tile.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:12px}
.stat{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:14px;display:grid;gap:2px}
.stat b{font-size:1.6rem;font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--muted)}
.mod{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:14px;text-align:left;width:100%;min-height:72px}
.mod .code{width:44px;height:44px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:800;flex:none}
.mod.done .code{background:var(--benar);color:var(--surface)}
.mod .tx{flex:1;min-width:0;display:grid}
.mod .tx span{font-size:.85rem;color:var(--muted)}
.modlist{display:grid;gap:10px}
.rapor-mod{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rapor-mod:last-child{border-bottom:0}
.note{font-size:.85rem;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.input{width:100%;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:1.1rem;padding:0 14px}
.input:focus{outline:none;border-color:var(--primary)}

#keypad{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface-2);border-top:1px solid var(--line);box-shadow:var(--shadow);padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.kp-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kp-lab{grid-column:1/-1;font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center;min-height:24px;gap:8px}
.kp-lab b{color:var(--text)}
.k{min-height:48px;border:0;border-radius:12px;background:var(--surface);font-size:1.3rem;font-weight:800;box-shadow:0 1px 0 var(--line);transition:transform .08s}
.k:active{transform:scale(.96)}
.k.go{grid-column:span 2;background:var(--primary);color:var(--primary-ink);font-size:1.05rem}
.k.sm{font-size:1rem}

.overlay{position:fixed;inset:0;z-index:60;background:rgba(5,12,10,.72);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov-in{width:100%;max-width:760px;max-height:100%;overflow:auto;background:var(--surface);border-radius:16px;padding:12px;display:grid;gap:10px}

@media (min-width:600px){ .items{grid-template-columns:repeat(4,1fr)} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important;scroll-behavior:auto!important} }

<body>
<div id="app"></div>
<div id="keypad" hidden></div>

<script>
(function(){
"use strict";
var app = document.getElementById('app');
var kp = document.getElementById('keypad');

/* ================= Matematika (data umum → JavaScript) ================= */
function grp(s){ return String(s).replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function fmt(n){ return 'Rp' + grp(Math.round(n)); }
function pct(n){ return String(Math.round(n*100)/100).replace('.',',') + '%'; }
function potongan(h,d){ return Math.round(h*d/100); }
function hargaAkhir(h,d){ return h - potongan(h,d); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
var reduceMotion = false;
try{ reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

var store = {
  get:function(k,d){ try{ var v=localStorage.getItem('pp_'+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set:function(k,v){ try{ localStorage.setItem('pp_'+k, JSON.stringify(v)); }catch(e){} }
};
function defStats(){ return {dijawab:0, benar:0, paas:[], literasi:0, pasar:0, mk:{}, modul:{}}; }

/* ================= Ikon & label warna tetap ================= */
var I = {
  back:'<svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  next:'<svg class="ic" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  home:'<svg class="ic" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  book:'<svg class="ic" viewBox="0 0 24 24"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><path d="M5 18a2 2 0 0 1 2-2h12"/></svg>',
  cart:'<svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/><path d="M3 4h2l2.4 11h10.2L20 8H6.2"/></svg>',
  chart:'<svg class="ic" viewBox="0 0 24 24"><path d="M5 20V11M11 20V5M17 20v-6M3 20h18"/></svg>',
  search:'<svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>',
  tag:'<svg class="ic" viewBox="0 0 16 16"><path d="M1.5 8.5V2.5a1 1 0 0 1 1-1h6l6 6-6.5 6.5z"/><circle cx="5" cy="5" r="1"/></svg>',
  cut:'<svg class="ic" viewBox="0 0 16 16"><circle cx="4" cy="4" r="2"/><circle cx="4" cy="12" r="2"/><path d="M5.6 5.2L14 12M5.6 10.8L14 4"/></svg>',
  pay:'<svg class="ic" viewBox="0 0 16 16"><rect x="1.5" y="3.5" width="13" height="9" rx="1.5"/><path d="M1.5 6.5h13"/></svg>',
  up:'<svg class="ic" viewBox="0 0 16 16"><path d="M8 13V3M4 7l4-4 4 4"/></svg>',
  down:'<svg class="ic" viewBox="0 0 16 16"><path d="M8 3v10M4 9l4 4 4-4"/></svg>',
  receipt:'<svg class="ic" viewBox="0 0 16 16"><path d="M3 1.5h10v13l-2-1.2-2 1.2-2-1.2-2 1.2-2-1.2z"/><path d="M5.5 5h5M5.5 8h5"/></svg>',
  pct:'<svg class="ic" viewBox="0 0 16 16"><circle cx="4.5" cy="4.5" r="1.8"/><circle cx="11.5" cy="11.5" r="1.8"/><path d="M13 3L3 13"/></svg>'
};
function lbl(cls, icon, teks){ return '<span class="lbl lbl-'+cls+'">'+icon+teks+'</span>'; }
var LBL = {
  awal:lbl('awal',I.tag,'Harga Awal'), pot:lbl('pot',I.cut,'Potongan'), diskon:lbl('pot',I.cut,'Diskon'),
  akhir:lbl('akhir',I.pay,'Harga Akhir'), beli:lbl('awal',I.tag,'Harga Beli'), jual:lbl('akhir',I.pay,'Harga Jual'),
  untung:lbl('untung',I.up,'Untung'), rugi:lbl('rugi',I.down,'Rugi'), harga:lbl('awal',I.tag,'Harga'),
  ppn:lbl('pajak',I.receipt,'PPN'), total:lbl('netral',I.pay,'Total Bayar'), persen:lbl('netral',I.pct,'Persen'),
  selisih:lbl('netral',I.pct,'Selisih'), hasil:lbl('netral',I.pct,'Hasil'), ur:lbl('netral',I.pct,'Untung atau Rugi')
};
var MK_TEKS = {
  MK1:'Menjawab nilai antara (potongan, untung, atau pajak) sebagai jawaban akhir',
  MK2:'Salah memilih menambah atau mengurangi',
  MK3:'Membagi dengan harga jual saat menghitung persen',
  MK5:'Menghitung pajak dari harga sebelum diskon',
  MK6:'Tertukar antara untung dan rugi',
  MK7:'Salah jumlah angka nol'
};

/* ================= Visual (SVG) ================= */
function barModel(h, pot, tampil){
  var W = 300, wA = Math.round(W*(h-pot)/h);
  return '<svg class="bar" viewBox="0 0 320 96" role="img" aria-label="Model batang: harga awal '+fmt(h)+', potongan '+(tampil?fmt(pot):'belum diketahui')+', harga akhir '+(tampil?fmt(h-pot):'belum diketahui')+'">'+
    '<text x="10" y="13" class="t-awal">Harga Awal '+fmt(h)+'</text>'+
    '<rect x="10" y="18" width="300" height="22" rx="5" class="f-awal"/>'+
    '<rect x="10" y="50" width="'+(wA-2)+'" height="22" rx="5" class="f-akhir"/>'+
    '<rect x="'+(10+wA)+'" y="50" width="'+(W-wA)+'" height="22" rx="5" class="f-pot"/>'+
    '<text x="10" y="88" class="t-akhir">Harga Akhir '+(tampil?fmt(h-pot):'?')+'</text>'+
    '<text x="310" y="88" text-anchor="end" class="t-pot">Potongan '+(tampil?fmt(pot):'?')+'</text></svg>';
}
function barBanding(hb, hj){
  var mx = Math.max(hb,hj), wB = Math.round(300*hb/mx), wJ = Math.round(300*hj/mx), up = hj>=hb, d = Math.abs(hj-hb), xm = 10+Math.min(wB,wJ);
  return '<svg class="bar" viewBox="0 0 320 104" role="img" aria-label="Harga beli '+fmt(hb)+', harga jual '+fmt(hj)+', '+(up?'untung ':'rugi ')+fmt(d)+'">'+
    '<text x="10" y="13" class="t-awal">Harga Beli '+fmt(hb)+'</text>'+
    '<rect x="10" y="18" width="'+wB+'" height="20" rx="5" class="f-awal"/>'+
    '<text x="10" y="55" class="t-akhir">Harga Jual '+fmt(hj)+'</text>'+
    '<rect x="10" y="60" width="'+wJ+'" height="20" rx="5" class="f-akhir"/>'+
    (up ? '<rect x="'+(10+wB)+'" y="60" width="'+(wJ-wB)+'" height="20" class="f-untung"/>' : '<rect x="'+(10+wJ)+'" y="18" width="'+(wB-wJ)+'" height="20" class="f-rugi"/>')+
    '<line x1="'+xm+'" y1="14" x2="'+xm+'" y2="84" class="ln-dash"/>'+
    '<text x="310" y="98" text-anchor="end" class="'+(up?'t-untung':'t-rugi')+'">'+(up?'Untung ':'Rugi ')+fmt(d)+'</text></svg>';
}
function barTambah(base, add){
  var wb = Math.round(300*base/(base+add));
  return '<svg class="bar" viewBox="0 0 320 70" role="img" aria-label="Harga '+fmt(base)+' ditambah PPN '+fmt(add)+', total '+fmt(base+add)+'">'+
    '<text x="10" y="13" class="t-akhir">Harga '+fmt(base)+'</text>'+
    '<text x="310" y="13" text-anchor="end" class="t-pajak">PPN '+fmt(add)+'</text>'+
    '<rect x="10" y="18" width="'+(wb-2)+'" height="22" rx="5" class="f-akhir"/>'+
    '<rect x="'+(10+wb)+'" y="18" width="'+(300-wb)+'" height="22" rx="5" class="f-pajak"/>'+
    '<text x="10" y="60" class="t-total">Total '+fmt(base+add)+'</text></svg>';
}
function gridPersen(p){
  var s = '<svg class="grid100" viewBox="0 0 228 228" role="img" aria-label="'+p+' dari 100 kotak diarsir">';
  for(var i=0;i<100;i++){ s += '<rect x="'+((i%10)*23)+'" y="'+(Math.floor(i/10)*23)+'" width="21" height="21" rx="3" class="'+(i<Math.round(p)?'g-on':'g-off')+'"/>'; }
  return s + '</svg><p class="cap">'+p+' dari 100 kotak = '+p+'%</p>';
}

/* ================= Konteks soal ================= */
var NAMA = ['Bu Sari','Rani','Dimas','Pak Budi','Ayu','Bagas','Bu Wati','Rizki'];
var KONTEKS = [
  {barang:'tas sekolah', toko:'Toko Ceria'}, {barang:'sepatu olahraga', toko:'Toko Langkah'},
  {barang:'jaket', toko:'Toko Hangat'}, {barang:'kotak pensil', toko:'Toko Alat Tulis Pena'},
  {barang:'botol minum', toko:'Koperasi Sekolah'}, {barang:'kemeja batik', toko:'Pasar Baru'},
  {barang:'kipas angin', toko:'Toko Elektronik Sejuk'}, {barang:'sepeda anak', toko:'Toko Roda'}
];
var BUAH = ['mangga','jambu','jeruk','salak','pisang'];
var YA_TIDAK = [['Ya',1],['Tidak',0]];

/* ================= Data modul (versi final: JSON di app/src/content) =================
   Setiap modul: istilah → contoh lengkap → contoh rumpang → 4 soal latihan (level 1,1,2,2).
   Setiap soal (dibuat generator) boleh punya: kal+chips (Pemecah Soal), ditanya, op (Pilih Operasi),
   f (langkah hitung), salah (deteksi miskonsepsi), hint (3 tingkat), cek (Cek Kewajaran), bahas, visual. */
var URUTAN = ['M0','M1','M2','M3','M4','M5'];
var MODUL = {};

/* ---------- M0 Pemanasan ---------- */
MODUL.M0 = {
  kode:'M0', judul:'Pemanasan Prasyarat', sub:'Persen, pecahan, dan perkalian bilangan besar',
  istilah:[
    {lbl:LBL.persen, judul:'Persen artinya per seratus', teks:'25% artinya 25 dari 100 bagian. Bayangkan 100 kotak, lalu arsir 25 kotak.', vis:gridPersen(25)},
    {lbl:LBL.persen, judul:'Persen patokan', teks:'Hafalkan tiga patokan ini: 10% = 1/10, 25% = 1/4, dan 50% = 1/2.', contoh:'10% dari Rp50.000 = Rp50.000 ÷ 10 = Rp5.000'},
    {lbl:LBL.persen, judul:'Pecah persen', teks:'Persen yang sulit bisa dipecah. 15% = 10% + 5%, dan 5% adalah setengah dari 10%.', contoh:'15% dari Rp40.000 = Rp4.000 + Rp2.000 = Rp6.000'}
  ],
  contoh:{ teks:'Berapa 15% dari Rp60.000?', visual:function(){ return gridPersen(15); }, langkah:[
    {t:'Hitung 10%', s:'10% dari Rp60.000 = Rp60.000 ÷ 10 = Rp6.000'},
    {t:'Hitung 5%', s:'5% = setengah dari 10% = Rp6.000 ÷ 2 = Rp3.000'},
    {t:'Jumlahkan', s:'15% = Rp6.000 + Rp3.000 = Rp9.000'},
    {t:'Cek kewajaran', s:'Rp9.000 lebih kecil dari Rp60.000, karena 15% kurang dari 100%.'}
  ]},
  rumpang:{ teks:'Berapa 25% dari Rp80.000?', langkah:[{t:'Ubah ke pecahan', s:'25% = 1/4'}], blank:{t:'Hitung', pre:'Rp80.000 ÷ 4 =', label:'25% dari Rp80.000', unit:'rp', jawab:20000},
    salah:{8000:'Itu 10%. 25% = 1/4, jadi bagi dengan 4.', 40000:'Itu 50%. 25% adalah setengahnya lagi.'}, umum:'Bagi Rp80.000 dengan 4.' },
  buat:function(level, i){
    var tipe = ['kali','persen','pecahan','pecah'][i];
    if(tipe==='kali'){
      var a = pick([25000,4500,12000,350,7500,1250]), b = pick([10,100]);
      return { id:'M0k'+a+b, tanya:'Berapa '+grp(a)+' × '+b+'?',
        f:[{key:'f1', label:'Hasil', tag:LBL.hasil, eq:grp(a)+' × '+b+' =', jawab:a*b, unit:'angka', cekLagi:'Dikali '+b+' berarti menambah '+(b===10?'satu':'dua')+' angka nol di belakang.'}],
        hint:['Mengalikan dengan '+b+' sama dengan menambah angka nol di belakang.', 'Tambahkan '+(b===10?'satu angka nol':'dua angka nol')+'.', 'Contoh: 45 × '+b+' = '+grp(45*b)+'.'],
        benar:grp(a)+' × '+b+' = '+grp(a*b)+'.',
        cek:{q:'Apakah '+grp(a*b)+' memiliki '+(b===10?'satu':'dua')+' angka nol lebih banyak daripada '+grp(a)+'?', opsi:YA_TIDAK, ok:'Betul, itu ciri perkalian dengan '+b+'.', no:'Coba hitung angka nolnya lagi: '+grp(a)+' menjadi '+grp(a*b)+'.'},
        bahas:[['Kalikan', grp(a)+' × '+b+' = '+grp(a*b)],['Cek', 'Ada '+(b===10?'satu':'dua')+' angka nol tambahan di belakang.']] };
    }
    if(tipe==='persen'){
      var N = pick([40000,60000,80000,120000,200000]), p = pick([10,25,50]), ans = N*p/100, bagi = 100/p;
      return { id:'M0p'+N+p, tanya:'Berapa '+p+'% dari '+fmt(N)+'?', visual:gridPersen(p),
        f:[{key:'f1', label:p+'% dari '+fmt(N), tag:LBL.persen, eq:p+'% × '+fmt(N)+' =', jawab:ans, unit:'rp', cekLagi:p+'% = 1/'+bagi+', jadi bagi '+fmt(N)+' dengan '+bagi+'.'}],
        hint:['Ingat persen patokan: 10% = 1/10, 25% = 1/4, 50% = 1/2.', p+'% = 1/'+bagi+'.', 'Hitung '+fmt(N)+' ÷ '+bagi+'.'],
        benar:p+'% dari '+fmt(N)+' = '+fmt(ans)+'.',
        cek:{q:'Apakah '+fmt(ans)+' lebih kecil dari '+fmt(N)+'?', opsi:YA_TIDAK, ok:'Betul. '+p+'% kurang dari 100%, jadi hasilnya lebih kecil.', no:fmt(ans)+' memang lebih kecil dari '+fmt(N)+', karena '+p+'% kurang dari 100%.'},
        bahas:[['Ubah ke pecahan', p+'% = 1/'+bagi],['Bagi', fmt(N)+' ÷ '+bagi+' = '+fmt(ans)]] };
    }
    if(tipe==='pecahan'){
      var pr = pick([[1,2],[1,4],[3,4],[1,5],[2,5],[1,10],[3,10]]), a2 = pr[0], b2 = pr[1], pc = a2*100/b2, kali = 100/b2;
      return { id:'M0f'+a2+b2, tanya:'Ubah pecahan '+a2+'/'+b2+' menjadi persen.', visual:gridPersen(pc),
        f:[{key:'f1', label:a2+'/'+b2+' dalam persen', tag:LBL.persen, eq:a2+'/'+b2+' =', jawab:pc, unit:'persen', cekLagi:'Ubah penyebutnya menjadi 100 dengan mengalikan pembilang dan penyebut dengan angka yang sama.'}],
        hint:['Persen artinya per seratus. Ubah penyebutnya menjadi 100.', 'Kalikan pembilang dan penyebut dengan '+kali+'.', a2+'/'+b2+' = '+(a2*kali)+'/100.'],
        benar:a2+'/'+b2+' = '+(a2*kali)+'/100 = '+pc+'%.',
        cek:{q:'Pecahan '+a2+'/'+b2+' kurang dari 1. Apakah '+pc+'% kurang dari 100%?', opsi:YA_TIDAK, ok:'Betul, pecahan yang kurang dari 1 bernilai kurang dari 100%.', no:pc+'% memang kurang dari 100%.'},
        bahas:[['Samakan penyebut', a2+'/'+b2+' = '+(a2*kali)+'/100'],['Tulis sebagai persen', (a2*kali)+'/100 = '+pc+'%']] };
    }
    var N2 = pick([40000,60000,80000,120000,200000]), p2 = pick([15,5,20,75]), L;
    if(p2===15) L = [['10%',N2/10,'10% = 1/10'],['5%',N2/20,'5% = setengah dari 10%'],['15%',N2*15/100,'15% = 10% + 5%']];
    else if(p2===5) L = [['10%',N2/10,'10% = 1/10'],['5%',N2/20,'5% = setengah dari 10%']];
    else if(p2===20) L = [['10%',N2/10,'10% = 1/10'],['20%',N2/5,'20% = 2 × 10%']];
    else L = [['50%',N2/2,'50% = 1/2'],['25%',N2/4,'25% = setengah dari 50%'],['75%',N2*3/4,'75% = 50% + 25%']];
    var ansP = N2*p2/100;
    return { id:'M0c'+N2+p2, tanya:'Berapa '+p2+'% dari '+fmt(N2)+'? Pakai cara pecah persen.', visual:gridPersen(p2),
      f:L.map(function(x,j){ return {key:'f'+(j+1), label:x[0]+' dari '+fmt(N2), tag:LBL.persen, eq:x[0]+' dari '+fmt(N2)+' =', jawab:x[1], unit:'rp', cekLagi:'Cek lagi Langkah '+(j+1)+'. '+x[2]+'.'}; }),
      hint:['Mulai dari persen patokan, lalu pecah atau gabungkan.', L.map(function(x){return x[2];}).join('; ')+'.', L[0][0]+' dari '+fmt(N2)+' = '+fmt(L[0][1])+'.'],
      benar:p2+'% dari '+fmt(N2)+' = '+fmt(ansP)+'.',
      cek:{q:'Apakah '+fmt(ansP)+' lebih kecil dari '+fmt(N2)+'?', opsi:YA_TIDAK, ok:'Betul. '+p2+'% kurang dari 100%.', no:fmt(ansP)+' memang lebih kecil dari '+fmt(N2)+'.'},
      bahas:L.map(function(x){ return [x[0], x[2]+' → '+fmt(x[1])]; }) };
  }
};

/* ---------- M1 Untung dan Rugi ---------- */
MODUL.M1 = {
  kode:'M1', judul:'Untung dan Rugi', sub:'Harga beli, harga jual, untung, rugi',
  istilah:[
    {lbl:LBL.beli, judul:'Harga Beli', teks:'Harga saat pedagang membeli barang, misalnya dari petani, pabrik, atau grosir.', contoh:'Pak Budi membeli mangga dari petani seharga Rp200.000.'},
    {lbl:LBL.jual, judul:'Harga Jual', teks:'Harga saat pedagang menjual barang kepada pembeli.', contoh:'Semua mangga itu laku Rp240.000.'},
    {lbl:LBL.ur, judul:'Untung dan Rugi', teks:'Bandingkan harga jual dengan harga beli. Lebih besar berarti untung, lebih kecil berarti rugi.', contoh:'Untung = Harga Jual − Harga Beli. Rugi = Harga Beli − Harga Jual.'}
  ],
  contoh:{ teks:'Pak Budi membeli 20 kg mangga seharga Rp200.000. Ia menjual semuanya dengan harga Rp12.000 per kg. Untung atau rugi?',
    visual:function(t){ return t ? barBanding(200000,240000) : ''; }, langkah:[
    {t:'Hitung harga jual total', s:'20 × Rp12.000 = Rp240.000'},
    {t:'Bandingkan', s:'Rp240.000 lebih besar dari Rp200.000, jadi untung.'},
    {t:'Hitung untung', s:'Untung = Rp240.000 − Rp200.000 = Rp40.000'},
    {t:'Cek kewajaran', s:'Harga beli + untung = Rp200.000 + Rp40.000 = Rp240.000 (sama dengan harga jual).'}
  ]},
  rumpang:{ teks:'Pedagang membeli jambu seharga Rp150.000. Semua jambu laku Rp130.000.', langkah:[{t:'Bandingkan', s:'Rp130.000 lebih kecil dari Rp150.000, jadi rugi.'}],
    blank:{t:'Hitung rugi', pre:'Rp150.000 − Rp130.000 =', label:'Rugi', unit:'rp', jawab:20000},
    salah:{280000:'Untung atau rugi dicari dengan pengurangan, bukan penjumlahan.'}, umum:'Kurangi Rp150.000 dengan Rp130.000.' },
  buat:function(level){
    var nm = pick(NAMA), buah = pick(BUAH), untung = Math.random()<0.5, hb, hj, q = 0, hjkg = 0, n = 0;
    if(level===1){ hb = pick([120000,150000,200000,250000,300000]); var sel = pick([20000,25000,30000,50000]); hj = untung ? hb+sel : hb-sel; }
    else { do { q = pick([10,20,25,40]); hb = pick([140000,200000,240000,300000,400000]); hjkg = pick([5000,6000,8000,9000,10000,12000,14000,15000]); hj = q*hjkg; n++; }
           while((hj===hb || Math.abs(hj-hb)>0.4*hb || (hj>hb)!==untung) && n<200); untung = hj>hb; }
    var d = Math.abs(hj-hb), jenis = untung?'untung':'rugi';
    var kal, chips, dk, f;
    if(level===1){
      kal = [nm+' membeli '+buah+' seharga {{hb}}.', 'Semua '+buah+' itu ia jual dengan harga {{hj}}.', 'Apakah '+nm+' untung atau rugi? Berapa besarnya?'];
      chips = {hb:{teks:fmt(hb),cls:'awal'}, hj:{teks:fmt(hj),cls:'akhir'}};
      dk = [{k:'hb',lbl:LBL.beli,isi:fmt(hb)},{k:'hj',lbl:LBL.jual,isi:fmt(hj)}];

function mulaiModul(k){ S.cur = k; S.mods[k] = {tahap:'istilah', i:0, c:1, fb:null}; clearFields(); }
function mulaiLatihan(){
  var d = D(), lv = [1,1,2,2], out = [], ids = {};
  for(var i=0;i<4;i++){ var s, n=0; do { s = d.buat(lv[i], i); n++; } while(ids[s.id] && n<25); ids[s.id]=1; s.level = lv[i]; out.push(s); }
  S.mods[S.cur] = {tahap:'latihan', soal:out, i:0, benar:0, paas:null};
  resetSoal();
}
function wajibChips(s){ return s.chips ? Object.keys(s.chips).filter(function(k){ return s.chips[k] && !s.chips[k].pengecoh; }) : []; }
function resetSoal(){
  var m = M(), s = m.soal[m.i];
  m.step = s.chips ? 'pahami' : (s.op ? 'operasi' : 'hitung');
  m.tapped={}; m.ditanya=null; m.op=null; m.tries=0; m.hint=0; m.fb=null; m.ok=null; m.cek=null; m.bahas=0;
  clearFields();
  if(m.step==='hitung'){ S.active = s.f[0].key; }
}

    return header('Kenali istilah', tag+' · '+(m.i+1)+' dari '+d.istilah.length,'tutupModul')+wrap(
      '<section class="card">'+it.lbl+'<h2>'+it.judul+'</h2><p>'+it.teks+'</p>'+(it.vis||'')+(it.contoh?'<p class="muted num">'+it.contoh+'</p>':'')+'</section>'+
      '<div class="dots">'+d.istilah.map(function(_,i){return '<i class="'+(i===m.i?'on':'')+'"></i>';}).join('')+'</div>'+
      btn('Sudah paham? Langsung ke latihan','keLatihan',{cls:'ghost'})
    )+actionbar((m.i>0?btn('Kembali','istPrev',{cls:'secondary'}):'')+btn(m.i<d.istilah.length-1?'Lanjut':'Lihat contoh','istNext'));
  }
  if(m.tahap==='contoh'){
    var C = d.contoh, semua = m.c>=C.langkah.length;
    return header('Contoh lengkap', tag+' · langkah '+m.c+' dari '+C.langkah.length,'tutupModul')+wrap(
      '<section class="card"><p class="tanya">'+C.teks+'</p>'+C.visual(m.c>=C.langkah.length-1)+'</section>'+
      '<section class="card">'+stepsList(C.langkah.slice(0,m.c).map(function(l){ return [l.t,l.s]; }))+'</section>'
    )+actionbar(btn(semua?'Coba contoh rumpang':'Langkah berikutnya','contohNext'));
  }
  if(m.tahap==='rumpang'){
    var R = d.rumpang, B = R.blank, done = m.fb && m.fb.ok;
    S.keyAction = done ? null : 'rumpangPeriksa';
    var n = R.langkah.length;
    return header('Contoh rumpang','Lengkapi langkah terakhir','tutupModul')+wrap(
      '<section class="card"><p class="tanya">'+R.teks+'</p></section>'+
      '<section class="card"><ol class="steps">'+R.langkah.map(function(l,i){ return '<li><span class="n">'+(i+1)+'</span><div><span class="t">'+l.t+'</span><span class="num">'+l.s+'</span></div></li>'; }).join('')+
        '<li><span class="n">'+(n+1)+'</span><div style="display:grid;gap:8px"><span class="t">'+B.t+'</span><div class="eq"><span>'+B.pre+'</span>'+field('rump',B.label,B.unit)+'</div></div></li></ol></section>'+fbBox(m.fb)
    )+actionbar(done ? btn('Mulai latihan','keLatihan') : btn('Periksa','rumpangPeriksa',{dis:!S.vals.rump}));
  }
  if(m.tahap==='latihan') return rLatihan(d, m);
  if(m.tahap==='paas'){
    var b=''; for(var x=1;x<=9;x++){ b += '<button data-act="paas" data-arg="'+x+'" aria-pressed="'+(m.paas===x)+'">'+x+'</button>'; }
    return header('Skala usaha','Satu pertanyaan singkat','tutupModul')+wrap(
      '<section class="card"><h2>Seberapa besar usahamu mengerjakan soal tadi?</h2>'+
      '<div class="paas" role="group" aria-label="Skala 1 sampai 9">'+b+'</div>'+
      '<div class="paas-scale"><span>1 = sangat ringan</span><span>9 = sangat berat</span></div></section>'+
      '<p class="note">Jawabanmu membantu peneliti mengetahui seberapa berat soal ini terasa. Tidak ada jawaban benar atau salah.</p>'
    )+actionbar(btn('Kirim','paasKirim',{dis:!m.paas}));
  }
  if(m.tahap==='ringkasan'){
    var idx = URUTAN.indexOf(d.kode), next = URUTAN[idx+1];
    var pesan = m.paas>=7 ? 'Soal terasa berat? Lihat contoh lengkap sekali lagi, lalu ulangi latihan.' : (m.benar>=3 ? 'Bagus! Kamu siap lanjut ke modul berikutnya.' : 'Coba ulangi latihan. Gunakan petunjuk jika perlu.');
    var ekstra = d.kode==='M4' ? btn('Tantangan Literasi','go',{arg:'literasi',cls:'secondary'}) : (d.kode==='M5' ? btn('Pasar Pintar','go',{arg:'pasar',cls:'secondary'}) : '');
    return header('Latihan selesai', tag,'tutupModul')+wrap(
      '<section class="card"><span class="eyebrow">Hasilmu</span><h2 class="num">'+m.benar+' dari '+m.soal.length+' soal benar</h2><p>'+pesan+'</p></section>'+
      ekstra+btn('Ulangi latihan','keLatihan',{cls:'secondary'})+btn('Lihat contoh lagi','ulangContoh',{cls:'secondary'})
    )+actionbar(next ? btn('Lanjut ke '+next+' '+MODUL[next].judul,'keModul',{arg:next}) : btn('Ke Beranda','go',{arg:'beranda'}));
  }
  return '';
}

function rLatihan(d, m){
  var s = m.soal[m.i];
  var title = 'Soal '+(m.i+1)+' dari '+m.soal.length, sub = d.kode+' '+d.judul+' · Level '+s.level;
  if(m.step==='pahami'){
    var kal = s.kal.map(function(t){ return '<p>'+t.replace(/\{\{(\w+)\}\}/g, function(_,k){
      var c = s.chips[k]; if(!c) return ''; var st = m.tapped[k];
      var cls = st==='no' ? 'no' : (st ? 'c-'+(c.cls||'netral') : '');
      return '<button class="chip '+cls+'" data-act="tap" data-arg="'+k+'" aria-pressed="'+(!!st)+'">'+c.teks+'</button>'; })+'</p>'; }).join('');
    var siap = wajibChips(s).every(function(k){ return m.tapped[k]===true; });
    var benarDt = s.ditanya ? m.ditanya===s.ditanya.benar : siap;
    var dt = '';
    if(siap && s.ditanya){
      dt = '<section class="card"><h2>Apa yang ditanya?</h2><div class="opts">'+s.ditanya.opsi.map(function(o){
        var on = m.ditanya===o[0]; return opt(o[1],'ditanya',o[0],on,on?(o[0]===s.ditanya.benar?'ok':'no'):''); }).join('')+'</div></section>';
    }
    return header(title,sub,'tutupModul')+wrap(
      '<section class="card soal"><span class="eyebrow">Ketuk angka yang penting</span>'+kal+'</section>'+
      '<section class="card"><span class="eyebrow">Diketahui</span><div class="dk">'+
        s.dk.map(function(r){ return '<div class="dk-row">'+r.lbl+'<span class="dk-val">'+(m.tapped[r.k]===true?r.isi:'—')+'</span></div>'; }).join('')+
        (s.ditanya ? '<div class="dk-row"><span class="eyebrow">Ditanya</span><span class="dk-val">'+(m.ditanya===s.ditanya.benar?s.ditanya.lbl:'—')+'</span></div>' : '')+
      '</div></section>'+dt+fbBox(m.fb)
    )+actionbar(btn('Lanjut','lanjutPahami',{dis:!(siap && benarDt)}));
  }
  var mini = s.dk ? '<div class="dk-mini">'+s.dk.map(function(r){ return '<span>'+r.lbl+' <b>'+r.isi+'</b></span>'; }).join('')+(s.ditanya?'<span>Ditanya: '+s.ditanya.lbl+'</span>':'')+'</div>'
                  : '<section class="card"><p class="tanya">'+s.tanya+'</p>'+(s.visual && m.step!=='hasil' ? s.visual : '')+'</section>';
  if(m.step==='operasi'){
    var o0 = null; s.op.opsi.forEach(function(o){ if(o[0]===m.op) o0 = o; });
    return header(title,sub,'tutupModul')+wrap(mini+
      '<section class="card"><h2>'+s.op.tanya+'</h2><div class="opts">'+s.op.opsi.map(function(o){
        var on = m.op===o[0]; return opt(o[1],'operasi',o[0],on,on?(o[2]?'ok':'no'):''); }).join('')+'</div></section>'+fbBox(m.fb)
    )+actionbar(btn('Lanjut','lanjutHitung',{dis:!(o0 && o0[2])}));
  }
  if(m.step==='hitung'){
    S.keyAction = 'periksa';
    var semuaIsi = s.f.every(function(f){ return !!S.vals[f.key]; });
    return header(title,sub,'tutupModul','<button class="pill-btn" data-act="hint"'+(m.hint>=3?' disabled':'')+'>Petunjuk'+(m.hint?' '+m.hint+'/3':'')+'</button>')+wrap(mini+
      (m.hint?'<div class="hintbox">'+s.hint.slice(0,m.hint).map(function(h){return '<p>'+h+'</p>';}).join('')+'</div>':'')+
      s.f.map(function(f,i){ return '<section class="card"><span class="eyebrow">Langkah '+(i+1)+(f.tag?' · '+f.tag:'')+'</span><div class="eq"><span>'+f.eq+'</span>'+field(f.key,f.label,f.unit)+'</div></section>'; }).join('')+
      fbBox(m.fb)+(m.tries===1?'<p class="note">Kamu punya 1 kesempatan lagi untuk soal ini.</p>':'')
    )+actionbar(btn('Periksa','periksa',{dis:!semuaIsi}));
  }
  // hasil
  var C = s.cek, cekHtml = '<section class="card"><span class="eyebrow">Cek kewajaran</span><p>'+C.q+'</p>';
  if(m.cek===null){ cekHtml += '<div class="row">'+C.opsi.map(function(o,i){ return btn(o[0],'cek',{arg:i,cls:'secondary'}); }).join('')+'</div>'; }
  else { var benarCek = !!C.opsi[m.cek][1]; cekHtml += fbBox(benarCek ? {ok:true,title:'Betul',msg:C.ok} : {ok:false,title:'Coba bandingkan lagi',msg:C.no}); }
  cekHtml += '</section>';
  var bahas = '';
  if(m.cek!==null){
    bahas = '<section class="card"><span class="eyebrow">Pembahasan</span>'+(s.visual||'')+stepsList(s.bahas.slice(0,m.bahas))+
      (m.bahas<s.bahas.length ? btn('Langkah berikutnya','bahasNext',{cls:'ghost'}) : '')+'</section>';
  }
  var last = m.i===m.soal.length-1;
  return header(title,sub,'tutupModul')+wrap((s.dk?'':'<section class="card"><p class="tanya">'+s.tanya+'</p></section>')+fbBox(m.fb)+cekHtml+bahas)+
    actionbar(btn(last?'Selesai':'Soal berikutnya','soalNext',{dis:m.cek===null}));
}

/* ================= Layar: Tantangan Literasi ================= */

  } else if(L.step===3){
    S.keyAction = L.ok[3] ? null : 'litCek3';
    var hints = ['Toko A: hitung 3 × Rp12.000 dulu, lalu kurangi 30% dari hasilnya.','Toko A: 3 × 12.000 = 36.000. Potongan 30% × 36.000 = 10.800.','Toko B: kamu hanya membayar 2 × Rp12.000.'];
    body = mini+(L.hint?'<div class="hintbox">'+hints.slice(0,L.hint).map(function(h){return '<p>'+h+'</p>';}).join('')+'</div>':'')+
      '<section class="card"><span class="eyebrow">Total bayar di Toko A</span>'+field('totA','Total Toko A','rp')+'</section>'+
      '<section class="card"><span class="eyebrow">Total bayar di Toko B</span>'+field('totB','Total Toko B','rp')+'</section>'+fbBox(L.fb);
    act = L.ok[3] ? btn('Lanjut','litLanjut') : btn('Periksa','litCek3',{dis:!(S.vals.totA&&S.vals.totB)});

  return header('Tantangan Literasi','Mana lebih hemat?','go" data-arg="beranda',(L.step===3?'<button class="pill-btn" data-act="litHint"'+(L.hint>=3?' disabled':'')+'>Petunjuk</button>':''))+

/* ================= Layar: Pasar Pintar ================= */
function rPasar(){
  var P = S.pasar;
  var hargaB = function(b){ return hargaAkhir(b.h,b.d); };
  if(P.step==='pilih'){
    var adaTas = P.keranjang.indexOf('tas')>-1;
    return header('Pasar Pintar','Misi belanja','go" data-arg="beranda')+wrap(
      '<section class="card"><div class="uang"><span class="eyebrow">Uangmu</span><strong>'+fmt(ANGGARAN)+'</strong></div>'+
      '<p><b>Misi:</b> beli tas sekolah dan minimal 1 barang lain. Uangmu harus cukup.</p></section>'+
      '<div class="items">'+BARANG.map(function(b){
        var on = P.keranjang.indexOf(b.id)>-1;
        return '<button class="item" data-act="barang" data-arg="'+b.id+'" aria-pressed="'+on+'"><span class="nm">'+b.nama+'</span>'+
          (b.d?'<span class="tag-d">Diskon '+b.d+'%</span><s>'+fmt(b.h)+'</s>':'<span class="harga">'+fmt(b.h)+'</span>')+
          '<span class="pick">'+(on?'✓ Di keranjang':'Ketuk untuk pilih')+'</span></button>';
      }).join('')+'</div>'+
      '<p class="note">Harga yang dicoret adalah Harga Awal. Kamu akan menghitung harga bayarnya di kasir.</p>'+fbBox(P.fb)
    )+actionbar(btn('Ke kasir ('+P.keranjang.length+' barang)','keKasir',{dis:!(adaTas && P.keranjang.length>=2)}));
  }
  if(P.step==='kasir'){
    S.keyAction = 'kasirPeriksa';
    return header('Kasir','Hitung belanjaanmu','pasarBack')+wrap(
      '<section class="card">'+P.keranjang.map(function(id){
        var b = barang(id);
        return '<div class="kasir-row"><strong>'+b.nama+'</strong><span class="small muted num">'+(b.d? fmt(b.h)+', diskon '+b.d+'%. Harga bayar:' : fmt(b.h)+', tanpa diskon. Harga bayar:')+'</span>'+field('f_'+id,'Harga bayar '+b.nama,'rp')+'</div>';
      }).join('')+'</section>'+
      '<section class="card"><span class="eyebrow">Total belanja</span>'+field('total','Total belanja','rp')+
      '<span class="eyebrow">Kembalian dari '+fmt(ANGGARAN)+'</span>'+field('kembali','Kembalian','rp')+'</section>'+fbBox(P.fb)+
      (P.over ? btn('Ganti barang','pasarBack',{cls:'secondary'}) : '')
    )+actionbar(btn('Periksa','kasirPeriksa'));
  }
  var tot = P.keranjang.reduce(function(a,id){ return a + hargaB(barang(id)); },0);
  return header('Misi selesai','Pasar Pintar','go" data-arg="beranda')+wrap(
    fbBox({ok:true,title:'Hebat!',msg:'Belanjaanmu pas dengan uangmu. Semua hitunganmu benar.'})+
    '<section class="card"><span class="eyebrow">Struk belanja</span><div class="struk">'+
      P.keranjang.map(function(id){ var b=barang(id); return '<div class="ln"><span>'+b.nama+(b.d?' (−'+b.d+'%)':'')+'</span><span>'+fmt(hargaB(b))+'</span></div>'; }).join('')+
      '<div class="ln tot"><span>Total</span><span>'+fmt(tot)+'</span></div>'+
      '<div class="ln"><span>Tunai</span><span>'+fmt(ANGGARAN)+'</span></div>'+
      '<div class="ln"><span>Kembali</span><span>'+fmt(ANGGARAN-tot)+'</span></div></div></section>'
  )+actionbar(btn('Main lagi','pasarUlang',{cls:'secondary'})+btn('Beranda','go',{arg:'beranda'}));
}

/* ================= Layar: Rapor ================= */
function rRapor(){
  var st = S.stats;
  var akur = st.dijawab ? Math.round(st.benar/st.dijawab*100) : 0;
  var rp = st.paas.length ? (st.paas.reduce(function(a,b){return a+b;},0)/st.paas.length).toFixed(1).replace('.',',') : '—';
  var mkList = Object.keys(st.mk).filter(function(k){return st.mk[k]>0 && MK_TEKS[k];});
  return header('Rapor Saya','Hanya tersimpan di HP ini')+wrap(
    '<div class="grid2">'+
      '<div class="stat"><b>'+st.benar+'/'+st.dijawab+'</b><span>Soal latihan benar</span></div>'+
      '<div class="stat"><b>'+akur+'%</b><span>Akurasi</span></div>'+
      '<div class="stat"><b>'+rp+'</b><span>Rata-rata usaha (1–9)</span></div>'+
      '<div class="stat"><b>'+st.literasi+'</b><span>Tantangan literasi selesai</span></div>'+
      '<div class="stat"><b>'+st.pasar+'</b><span>Misi pasar selesai</span></div>'+
      '<div class="stat"><b>'+URUTAN.filter(function(k){return st.modul[k];}).length+'/'+URUTAN.length+'</b><span>Modul selesai</span></div>'+
    '</div>'+
    '<section class="card"><span class="eyebrow">Hasil terbaik per modul</span>'+URUTAN.map(function(k){
      var r = st.modul[k]; return '<div class="rapor-mod"><span><b>'+k+'</b> '+MODUL[k].judul+'</span><span class="num muted">'+(r? r.benar+'/'+r.total : 'belum')+'</span></div>'; }).join('')+'</section>'+
    '<section class="card"><span class="eyebrow">Perlu diperhatikan</span>'+
      (mkList.length ? '<ul style="margin:0;padding-left:20px">'+mkList.map(function(k){return '<li>'+MK_TEKS[k]+' ('+st.mk[k]+'×)</li>';}).join('')+'</ul>' : '<p class="muted">Belum ada kesalahan yang berulang.</p>')+'</section>'+
    (S.confirmReset ? '<section class="card"><p><b>Hapus semua progres di HP ini?</b> Tindakan ini tidak bisa dibatalkan.</p><div class="row">'+btn('Batal','resetBatal',{cls:'secondary'})+btn('Hapus','resetYa')+'</div></section>'
      : btn('Hapus progres','resetTanya',{cls:'ghost'}))
  )+nav();
}

/* ================= Aksi ================= */
var ACT = {
  go:function(a){ go(a); },
  mulaiNama:function(){ var el=document.getElementById('nama'); var v=(el?el.value:'').trim().slice(0,20); S.nama=v||'Kawan'; store.set('nama',S.nama); },
  lewatiNama:function(){ S.nama='Kawan'; store.set('nama',S.nama); },
  focus:function(a){ S.active=a; S.scrollTo=true; },
  key:function(a){
    if(!S.active) return;
    var unit = S.units[S.active]||'rp', v = S.vals[S.active]||'';
    if(a==='del') v = v.slice(0,-1);
    else if(a===','){ if(unit!=='persen' || v.indexOf(',')>-1) return; v = (v===''?'0':v)+','; }
    else {
      if(unit!=='persen' && v==='' && (a==='0'||a==='000')) return;
      if(unit==='persen' && v.indexOf(',')>-1 && v.split(',')[1].length>=2) return;
      v = (v+a).slice(0,9);
    }
    S.vals[S.active] = v; S.fs[S.active] = ''; buzz(8);
  },
  kpClose:function(){ S.active=null; },
  kpGo:function(){ var f=S.keyAction; S.active=null; if(f && ACT[f]) ACT[f](); },

  bukaModul:function(k){
    k = k || S.cur || 'M0';
    if(!S.mods[k] || S.mods[k].tahap==='ringkasan') mulaiModul(k); else S.cur = k;
    S.mOpen = true; if(S.route!=='belajar') go('belajar'); window.scrollTo(0,0);
  },
  keModul:function(k){ mulaiModul(k); S.mOpen=true; window.scrollTo(0,0); },
  tutupModul:function(){ S.mOpen=false; S.active=null; },
  istNext:function(){ var m=M(); if(m.i<D().istilah.length-1) m.i++; else { m.tahap='contoh'; m.c=1; } },
  istPrev:function(){ var m=M(); if(m.i>0) m.i--; },
  contohNext:function(){ var m=M(); if(m.c<D().contoh.langkah.length) m.c++; else { m.tahap='rumpang'; m.fb=null; clearFields(); S.active='rump'; } window.scrollTo(0,0); },
  rumpangPeriksa:function(){
    var m=M(), R=D().rumpang, v=num('rump');
    if(sama(v, R.blank.jawab, R.blank.unit)){ S.fs.rump='ok'; m.fb={ok:true,msg:'Langkah terakhir benar. Kamu siap mencoba latihan.'}; buzz(15); return; }
    S.fs.rump='no';
    var msg = R.umum;
    Object.keys(R.salah||{}).forEach(function(k){ if(Math.abs(parseFloat(k)-v)<0.0001) msg = R.salah[k]; });
    m.fb={ok:false,msg:msg}; buzz(30);
  },
  keLatihan:function(){ mulaiLatihan(); window.scrollTo(0,0); },
  ulangContoh:function(){ S.mods[S.cur]={tahap:'contoh', i:0, c:1, fb:null}; clearFields(); },

  tap:function(k){
    var m=M(), c=m.soal[m.i].chips[k]; if(!c) return;
    if(c.pengecoh){ m.tapped[k]='no'; m.fb={ok:false,title:'Info ini tidak dipakai',msg:c.pengecoh}; return; }
    m.tapped[k]=true; m.fb=null;
  },
  ditanya:function(a){
    var m=M(), dt=m.soal[m.i].ditanya; m.ditanya=a;
    if(a===dt.benar){ m.fb=null; return; }
    dt.opsi.forEach(function(o){ if(o[0]===a) m.fb={ok:false,msg:o[2]}; });
  },
  lanjutPahami:function(){ var m=M(), s=m.soal[m.i]; m.fb=null; if(s.op) m.step='operasi'; else { m.step='hitung'; S.active=s.f[0].key; S.scrollTo=true; } },
  operasi:function(a){
    var m=M(), s=m.soal[m.i]; m.op=a;
    s.op.opsi.forEach(function(o){ if(o[0]===a){ m.fb={ok:!!o[2],msg:o[3]}; if(!o[2]) mk(o[4]); } });
  },
  lanjutHitung:function(){ var m=M(); m.step='hitung'; m.fb=null; S.active=m.soal[m.i].f[0].key; S.scrollTo=true; },
  hint:function(){ var m=M(); if(m.hint<3) m.hint++; },
  periksa:function(){
    var m=M(), s=m.soal[m.i], v={}, ok={}, semua=true, salahPertama=null;
    s.f.forEach(function(f){ var x=val(f.key,f.unit); v[f.key]=x; ok[f.key]=sama(x,f.jawab,f.unit); S.fs[f.key]=ok[f.key]?'ok':'no'; if(!ok[f.key]){ semua=false; if(!salahPertama) salahPertama=f; } });
    if(semua){
      m.ok=true; m.benar++; S.stats.benar++; S.stats.dijawab++; saveStats();
      m.step='hasil'; m.fb={ok:true,msg:s.benar}; buzz(15); window.scrollTo(0,0); return;
    }
    m.tries++;
    var r = s.salah ? s.salah(v, ok) : null;
    if(!r){
      var f = salahPertama, x = v[f.key];
      if(f.unit!=='persen' && (x===f.jawab*10 || x*10===f.jawab || x===f.jawab*100 || x*100===f.jawab)) r = {msg:'Hampir benar! Cek lagi banyaknya angka nol.', mk:'MK7'};
      else r = {msg:f.cekLagi};
    }
    mk(r.mk);
    if(m.tries>=2){ m.ok=false; S.stats.dijawab++; saveStats(); m.step='hasil'; m.fb={ok:false,msg:r.msg+' Lihat pembahasan di bawah.'}; window.scrollTo(0,0); }
    else m.fb={ok:false,msg:r.msg};
    buzz(30);
  },
  cek:function(a){ var m=M(), s=m.soal[m.i], i=+a; m.cek=i; m.bahas=1; if(!s.cek.opsi[i][1]) mk(s.cek.mkNo); },
  bahasNext:function(){ M().bahas++; },
  soalNext:function(){ var m=M(); if(m.i<m.soal.length-1){ m.i++; resetSoal(); } else { m.tahap='paas'; m.paas=null; S.active=null; } window.scrollTo(0,0); },
  paas:function(a){ M().paas=+a; },
  paasKirim:function(){
    var m=M(), prev=S.stats.modul[S.cur];
    S.stats.paas.push(m.paas);
    S.stats.modul[S.cur] = {benar: prev ? Math.max(prev.benar, m.benar) : m.benar, total:m.soal.length};
    saveStats(); m.tahap='ringkasan';
  },

  zoom:function(){ S.zoom=!S.zoom; },
  info:function(a){ var L=S.lit; L.info[a]=!L.info[a]; L.fb=null; },
  litCek1:function(){
    var L=S.lit, extra=null, miss=0;
    INFO.forEach(function(x){ if(x[2] && !L.info[x[0]]) miss++; if(!x[2] && L.info[x[0]] && !extra) extra=x[1]; });
    if(extra) L.fb={ok:false,msg:'"'+extra+'" tidak dibutuhkan untuk menghitung harga. Batalkan pilihannya.'};
    else if(miss) L.fb={ok:false,msg:'Masih ada '+miss+' info penting yang belum dipilih.'};
    else { L.fb={ok:true,msg:'Kamu memilih semua info yang dibutuhkan dan mengabaikan info yang tidak penting.'}; L.ok[1]=true; buzz(15); }
  },
  litLanjut:function(){ var L=S.lit; L.step++; L.fb=null; clearFields(); if(L.step===3){ S.active='totA'; } window.scrollTo(0,0); },
  ubah:function(a){ var p=a.split(':'); S.lit['u'+p[0]]=p[1]; S.lit.fb=null; },
  litCek2:function(){
    var L=S.lit, msg=[];
    if(L.uA==='a2') msg.push('Toko A: diskon mengurangi harga, bukan menambah.');
    if(L.uA==='a3') msg.push('Toko A: kamu butuh 3 buku, jadi hitung harga 3 buku dulu.');
    if(L.uB==='b1') msg.push('Toko B: dengan promo beli 2 gratis 1, satu buku gratis.');
    if(L.uB==='b3') msg.push('Toko B: yang gratis hanya 1 buku. Kamu tetap membayar 2 buku.');
    if(msg.length) L.fb={ok:false,msg:msg.join(' ')};
    else { L.fb={ok:true,msg:'Kamu sudah mengubah promo menjadi cara menghitung.'}; L.ok[2]=true; buzz(15); }
  },
  litHint:function(){ if(S.lit.hint<3) S.lit.hint++; },
  litCek3:function(){
    var L=S.lit, a=num('totA'), b=num('totB'), msg=[];
    S.fs={totA:a===25200?'ok':'no', totB:b===24000?'ok':'no'};
    if(a!==25200){
      if(a===10800){ msg.push('Rp10.800 itu potongan di Toko A. Kurangi Rp36.000 dengan potongan itu.'); mk('MK1'); }
      else if(a===36000) msg.push('Rp36.000 itu harga sebelum diskon. Kurangi dulu 30%.');
      else if(a===252000 || a===2520){ msg.push('Toko A hampir benar! Cek lagi banyaknya angka nol.'); mk('MK7'); }
      else msg.push('Cek lagi total Toko A.');
    }
    if(b!==24000){
      if(b===36000) msg.push('Di Toko B satu buku gratis, jadi kamu hanya membayar 2 buku.');
      else if(b===12000) msg.push('Di Toko B kamu tetap membayar 2 buku.');
      else msg.push('Cek lagi total Toko B.');
    }
    if(msg.length){ L.fb={ok:false,msg:msg.join(' ')}; buzz(30); }
    else { L.fb={ok:true,msg:'Toko A Rp25.200 dan Toko B Rp24.000.'}; L.ok[3]=true; buzz(15); }
  },
  pilihToko:function(a){ S.lit.pilih=a; S.lit.fb=null; },
  alasan:function(a){ S.lit.alasan=a; S.lit.fb=null; },
  litCek4:function(){
    var L=S.lit;
    if(L.pilih==='B' && L.alasan==='r1'){
      L.fb={ok:true,msg:'Toko B lebih hemat Rp1.200 karena total yang dibayar lebih kecil.'}; L.ok[4]=true;
      if(!L.counted){ L.counted=true; S.stats.literasi++; saveStats(); } buzz(15); return;
    }
    var msg = [];
    if(L.pilih!=='B') msg.push('Bandingkan total bayarnya: Toko A Rp25.200, Toko B Rp24.000.');
    if(L.alasan==='r2') msg.push('Persen diskon yang besar belum tentu lebih hemat. Bandingkan total yang dibayar.');
    if(L.alasan==='r3') msg.push('Ada barang gratis belum tentu lebih murah. Bandingkan total yang dibayar.');
    if(!msg.length) msg.push('Pilihanmu sudah tepat. Periksa lagi alasannya.');
    L.fb={ok:false,msg:msg.join(' ')}; buzz(30);
  },
  litPikir:function(){ S.lit.pikir=true; },
  litUlang:function(){ S.lit=newLit(); clearFields(); window.scrollTo(0,0); },

  barang:function(a){ var k=S.pasar.keranjang, i=k.indexOf(a); if(i>-1) k.splice(i,1); else k.push(a); S.pasar.fb=null; },
  keKasir:function(){ var P=S.pasar; P.step='kasir'; P.fb=null; P.over=false; clearFields(); S.active='f_'+P.keranjang[0]; S.scrollTo=true; window.scrollTo(0,0); },
  pasarBack:function(){ S.pasar.step='pilih'; S.pasar.fb=null; S.pasar.over=false; S.active=null; },
  kasirPeriksa:function(){
    var P=S.pasar, salah=null, tot=0;
    P.keranjang.forEach(function(id){
      var b=barang(id), harus=hargaAkhir(b.h,b.d), v=num('f_'+id);
      tot += harus;
      S.fs['f_'+id] = v===harus ? 'ok' : 'no';
      if(v!==harus && !salah) salah={b:b, v:v};
    });
    if(salah){
      var b=salah.b, msg;
      if(b.d && salah.v===potongan(b.h,b.d)){ msg='Untuk '+b.nama+', '+fmt(salah.v)+' itu potongannya. Yang dibayar adalah harga setelah dikurangi potongan.'; mk('MK1'); }
      else if(b.d) msg='Cek lagi '+b.nama+': hitung potongan '+b.d+'% dari '+fmt(b.h)+', lalu kurangi harga awalnya.';
      else msg=b.nama+' tidak didiskon, jadi harganya tetap '+fmt(b.h)+'.';
      P.fb={ok:false,msg:msg}; buzz(30); return;
    }
    var t=num('total');
    S.fs.total = t===tot ? 'ok' : 'no';
    if(t!==tot){ P.fb={ok:false,msg:'Harga tiap barang sudah benar. Sekarang jumlahkan semua harga bayarnya.'}; buzz(30); return; }
    if(tot>ANGGARAN){ P.over=true; S.fs.kembali=''; P.fb={ok:false,title:'Uangmu tidak cukup',msg:'Hitunganmu benar. Totalnya '+fmt(tot)+', lebih dari '+fmt(ANGGARAN)+' (kurang '+fmt(tot-ANGGARAN)+'). Ganti barang yang kamu pilih.'}; buzz(30); return; }
    var k=num('kembali');
    S.fs.kembali = k===ANGGARAN-tot ? 'ok' : 'no';
    if(k!==ANGGARAN-tot){ P.fb={ok:false,msg:'Kembalian = uangmu − total belanja.'}; buzz(30); return; }
    P.step='hasil'; P.fb=null;
    if(!P.counted){ P.counted=true; S.stats.pasar++; saveStats(); }
    buzz(15); window.scrollTo(0,0);
  },
  pasarUlang:function(){ S.pasar=newPasar(); clearFields(); window.scrollTo(0,0); },

  pasang:function(){
    if(!pasang.prompt) return;
    var p = pasang.prompt; pasang.prompt = null;
    try{ p.prompt(); p.userChoice.then(function(){ render(); }, function(){}); }catch(e){}
  },
  resetTanya:function(){ S.confirmReset=true; },
  resetBatal:function(){ S.confirmReset=false; },
  resetYa:function(){ S.stats=defStats(); saveStats(); S.confirmReset=false; S.mods={}; S.cur=null; S.mOpen=false; S.lit=newLit(); S.pasar=newPasar(); clearFields(); }
};

/* ================= Keypad Rupiah ================= */
function renderKeypad(){
  var open = !!S.active;
  kp.hidden = !open;
  document.body.classList.toggle('kp-open', open);
  if(!open){ kp.innerHTML=''; return; }
  var unit = S.units[S.active]||'rp', v = S.vals[S.active]||'';
  var keys = ['1','2','3','4','5','6','7','8','9', unit==='persen'?',':'000', '0','del'];
  var tampil = unit==='persen' ? (v||'0')+'%' : (unit==='rp' ? fmt(v||0) : grp(v||0));
  kp.innerHTML = '<div class="kp-in" role="group" aria-label="Keypad angka">'+
    '<div class="kp-lab"><span>Mengisi: <b>'+esc(S.labels[S.active]||'')+'</b></span><span class="num">'+esc(tampil)+'</span></div>'+
    keys.map(function(k){ return '<button class="k'+(k==='000'||k==='del'?' sm':'')+'" data-act="key" data-arg="'+k+'" aria-label="'+(k==='del'?'Hapus':(k===','?'Koma':k))+'">'+(k==='del'?'⌫':k)+'</button>'; }).join('')+
    '<button class="k sm" data-act="kpClose">Tutup</button>'+
    '<button class="k go" data-act="kpGo">'+(S.keyAction?'Periksa ✓':'Selesai')+'</button></div>';
}

/* ================= Render ================= */
function render(){
  S.keyAction=null; S.labels={}; S.units={};
  var html;
  if(S.nama===null) html = rOnboard();
  else if(S.route==='belajar') html = rBelajar();
  else if(S.route==='literasi') html = rLiterasi();
  else if(S.route==='pasar') html = rPasar();
  else if(S.route==='rapor') html = rRapor();
  else html = rBeranda();
  app.innerHTML = html;
  if(S.active && !S.labels[S.active]) S.active = null;
  renderKeypad();
  if(S.scrollTo){
    S.scrollTo=false;
    var el = document.querySelector('.field.on');
    if(el) requestAnimationFrame(function(){ try{ el.scrollIntoView({block:'center', behavior: reduceMotion?'auto':'smooth'}); }catch(e){ el.scrollIntoView(); } });
  }
}

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]');
  if(!t || t.disabled) return;
  var f = ACT[t.getAttribute('data-act')];
  if(!f) return;
  f(t.getAttribute('data-arg'));
  render();
});
document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && e.target && e.target.id==='nama'){ ACT.mulaiNama(); render(); return; }
  if(!S.active) return;
  if(/^[0-9]$/.test(e.key)){ ACT.key(e.key); render(); e.preventDefault(); }
  else if(e.key===',' || e.key==='.'){ ACT.key(','); render(); e.preventDefault(); }
  else if(e.key==='Backspace'){ ACT.key('del'); render(); e.preventDefault(); }
  else if(e.key==='Enter'){ ACT.kpGo(); render(); e.preventDefault(); }
  else if(e.key==='Escape'){ ACT.kpClose(); render(); }
});
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); pasang.prompt = e; render(); });
window.addEventListener('appinstalled', function(){ pasang.installed = true; pasang.prompt = null; render(); });

readHash();
render();
})();
</script>
